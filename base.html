<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>{% block title %}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
  </head>
  <body>
    <div class="page">
      <header
        class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom"
      >
        <a
          href="/"
          class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none"
        >
          <img
            class="header__img"
            src="{{ url_for('static', filename='img/i.jpeg') }}"
            alt="Логотип юридической компании"
          />
        </a>

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
          <li>
            <a
              href="{{ url_for('index') }}"
              class="nav-link px-2 link-secondary"
              >Главная</a
            >
          </li>
          <li>
            <a href="{{ url_for('posts') }}" class="nav-link px-2 link-dark"
              >Все записи</a
            >
          </li>
          <li>
            <a href="{{ url_for('create') }}" class="nav-link px-2 link-dark"
              >Добавить запись</a
            >
          </li>
        </ul>

        <div class="col-md-3 text-end">
          <button type="button" class="btn btn-outline-primary me-2">
            Войти
          </button>
          <button type="button" class="btn btn-primary">
            Зарегистрироваться
          </button>
        </div>
      </header>
      <div class="content">{% block content %}{% endblock %}</div>
      <footer
        class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      >
        <div class="col-md-4 d-flex align-items-center">
          <span class="mb-3 mb-md-0 text-body-secondary"
            >© 2026 Company, Inc</span
          >
        </div>

        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
          <li class="ms-3">
            <a href="#" aria-label="Telegram">
              <img
                class="footer__img"
                src="{{ url_for('static', filename='img/tg.png') }}"
                alt="Telegram"
                width="24"
                height="24"
              />
            </a>
          </li>
        </ul>
      </footer>
    </div>
  </body>
</html>
